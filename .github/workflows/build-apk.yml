name: Build QuickFlow APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Build Android Release APK
        run: flutter build apk --release

      - name: Prepare APK for Release
        run: |
          mkdir -p release-output
          cp build/app/outputs/flutter-apk/app-release.apk release-output/QuickFlow.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuickFlow-Android-APK
          path: release-output/QuickFlow.apk
          retention-days: 30

      - name: Create GitHub Release with APK Download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: QuickFlow v1.0.0
          draft: false
          prerelease: false
          body: |
            ### ⚡ QuickFlow v1.0.0
            **Floating Text Palette & Direct Text Injection for Android**

            #### 📲 Download & Installation
            1. Download the **`QuickFlow.apk`** file below directly on your Android phone.
            2. Open the downloaded file to install (allow "Install from unknown sources" if prompted).
            3. Open **QuickFlow** and tap the guided setup buttons to enable:
               - **Display over other apps** (allows the bubble & palette to float)
               - **QuickFlow Accessibility Service** (allows direct 1-tap typing into chat boxes)
            4. Switch on the floating bubble and start messaging in WhatsApp, Instagram, Telegram, etc.!
          files: release-output/QuickFlow.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
