name: Build QuickFlow Native APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Ultra-light APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission to Gradlew
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper
          fi
          chmod +x gradlew

      - name: Build Android Release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Prepare APK for Release
        run: |
          mkdir -p release-output
          cp app/build/outputs/apk/release/app-release.apk release-output/QuickFlow.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuickFlow-Stage1-APK
          path: release-output/QuickFlow.apk
          retention-days: 30

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: QuickFlow v1.0.0 (Stage 1 Lightweight Bubble)
          draft: false
          prerelease: false
          body: |
            ### ⚡ QuickFlow Stage 1: Ultra-lightweight Floating Bubble
            A minimal, always-running floating bubble that displays persistently over all your apps!

            - **App Size:** ~1.5 MB (Pure Native Android, zero bloat)
            - **Always-on Background Service:** Stays active over WhatsApp, Instagram, Telegram, etc.
            - **Draggable & Docking:** Smooth touch dragging that docks to screen edges.

            #### 📲 Download Link:
            Download **`QuickFlow.apk`** below directly to your Android device.

            #### 🔧 1-Step Setup:
            1. Install `QuickFlow.apk` (tap "Download anyway" / allow unknown apps if prompted).
            2. Open QuickFlow and tap **"Grant Overlay Permission"** -> Allow "Display over other apps".
            3. Tap **"Start Floating Bubble"** — that's it! The ⚡ bubble will float on your screen always.
          files: release-output/QuickFlow.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
